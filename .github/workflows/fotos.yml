name: fotos
on:
  workflow_dispatch:
    inputs:
      script:
        description: script to run
        default: tools/fotos/buscar.py
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow
      - run: python ${{ github.event.inputs.script }}
      - uses: actions/upload-artifact@v4
        with: { name: dl, path: dl/, if-no-files-found: ignore, retention-days: 3 }
      - name: commit
        run: |
          git config user.name "fotos-bot"; git config user.email "fotos-bot@users.noreply.github.com"
          git add -A tools/fotos fotos fotos.json || true
          git diff --cached --quiet || git commit -m "fotos: resultados de ${{ github.event.inputs.script }}"
          for i in 1 2 3 4 5 6; do git pull --rebase && git push && break; sleep $((i*7)); done
